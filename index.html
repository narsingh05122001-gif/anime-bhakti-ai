<!-- VIDEO PREVIEW wale panel me ye buttons badlo -->
<div class="panel">
<h3>3. वीडियो प्रीव्यू</h3>
<div id="stage">
<img id="person" alt="Character">
<div id="mouth"></div>
<div id="speaker">कैरेक्टर यहाँ दिखाई देगा</div>
</div>
<p id="status">तैयार है ❤️</p>

<button onclick="playScript()">▶ पूरी स्क्रिप्ट चलाओ</button>
<button class="secondary" onclick="pauseScript()">⏸ रोकें</button>
<button class="danger" onclick="stopScript()">⏹ बंद करें</button>

<!-- YE 2 NAYE BUTTON JODE HAIN -->
<button style="background:#00d26a; margin-top:10px" onclick="startRecording()">🔴 Recording Start Karo</button>
<button style="background:#3b82f6; margin-top:10px" onclick="downloadVideo()">📥 Video Download Karo</button>
<p class="small">Note: Recording start karke script chalao, fir download dabao.</p>
</div>

<script>
// Aapke purane script ke neeche ye naya code jodo
let mediaRecorder;
let recordedChunks = [];

async function startRecording(){
  const stage = document.getElementById('stage');
  const stream = stage.captureStream ? stage.captureStream(30) : null;
  
  // Screen recording API use
  try{
    const fullStream = await navigator.mediaDevices.getDisplayMedia({video:true, audio:true});
    mediaRecorder = new MediaRecorder(fullStream);
  } catch(e){
    alert("Screen record allow karo, tabhi download hoga");
    return;
  }

  recordedChunks = [];
  mediaRecorder.ondataavailable = e => { if(e.data.size>0) recordedChunks.push(e.data); };
  mediaRecorder.onstop = () => {
    $("status").textContent = "Recording ho gayi, ab Download dabao";
  };
  mediaRecorder.start();
  $("status").textContent = "🔴 Recording chal rahi hai... ab script chalao";
}

function downloadVideo(){
  if(recordedChunks.length==0){
    alert("Pehle Recording Start karo aur script chalao");
    return;
  }
  let blob = new Blob(recordedChunks, {type:'video/webm'});
  let url = URL.createObjectURL(blob);
  let a = document.createElement('a');
  a.href = url;
  a.download = "anime-bhakti-video.webm";
  a.click();
  $("status").textContent = "Video Download ho gaya ❤️";
}
</script>
