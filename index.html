<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anime Bhakti AI</title>
<style>
body{background:#fff7e6;font-family:Arial;margin:0}
header{background:#ff4d00;color:white;text-align:center;padding:20px}
.box{background:white;margin:12px;padding:15px;border-radius:15px}
textarea{width:100%;height:140px;padding:10px;font-size:15px}
input{width:100%;padding:10px;margin-top:10px}
button{width:100%;background:#ff5a00;color:white;border:none;padding:14px;border-radius:25px;font-weight:bold;font-size:16px;margin-top:10px}
.scene{background:#fff0d6;padding:12px;margin:10px 0;border-radius:10px;border-left:5px solid #ff5a00}
.small{width:auto;background:green;padding:8px 15px;border-radius:20px;font-size:14px;margin:5px 5px 0 0}
</style>
</head>
<body>
<header><h1>🙏 Anime Bhakti AI 🙏</h1><p>Sab Kuch Yahi Hoga</p></header>
<div class="box">
<h2>🎬 STUDIO</h2>
<input id="title" value="Episode 2 - Hanuman ji">
<textarea id="script">Narrator: Aaj Ayodhya me sab Hanuman ji ka intezar kar rahe hain.
Ram: Hanuman, tum kahan ho?
Hanuman: Jai Shree Ram! Prabhu, main aa gaya!
Sita: Hanuman, tum to mere bete jaisa ho.
Hanuman: Mata, ye sab Prabhu ki kripa hai.</textarea>
<button onclick="banao()">✨ EPISODE BANAO - DABAO ✨</button>
</div>
<div id="output"></div>
<script>
function banao(){
alert("Button kaam kar gaya!");
var t=document.getElementById("script").value;
var lines=t.split("\n");
var html='<div class="box"><h2>✅ Episode Ban Gaya!</h2>';
for(var i=0;i<lines.length;i++){
if(lines[i].trim()=="") continue;
var parts=lines[i].split(":");
var name=parts[0];
var dialog=parts.slice(1).join(":");
html+='<div class="scene"><b>'+name+' Bolega:</b><p>'+dialog+'</p><button class="small" onclick="bolo(\''+dialog.replace(/'/g,"")+'\')">🔊 Suno</button></div>';
}
html+='<p style="color:green;font-weight:bold">Ab upar se Screen Record on karo aur 🔊 Suno dabate jao, video ban jayega!</p></div>';
document.getElementById("output").innerHTML=html;
window.scrollTo(0,500);
}
function bolo(txt){
var u=new SpeechSynthesisUtterance(txt);
u.lang="hi-IN";
speechSynthesis.speak(u);
}
</script>
</body>
</html>
